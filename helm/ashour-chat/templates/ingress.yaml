{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ashour-chat-ingress
  namespace: {{ .Release.Namespace }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: {{ .Values.frontend.service.port }}
          - path: /api/reactions
            pathType: Prefix
            backend:
              service:
                name: reactions-svc
                port:
                  number: {{ .Values.reactions.service.port }}
          - path: /api/mood
            pathType: Prefix
            backend:
              service:
                name: mood-svc
                port:
                  number: {{ .Values.mood.service.port }}
{{- end }}
