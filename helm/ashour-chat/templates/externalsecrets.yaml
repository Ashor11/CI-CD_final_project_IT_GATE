{{- if .Values.vault.enabled }}
{{- $vaultKey := .Values.vault.kvKey | default "ashour-chat" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactions-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.vault.secretStoreName }}
    kind: SecretStore
  target:
    name: reactions-secret
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ $vaultKey }}
        property: redisPassword
    - secretKey: MYSQL_USER
      remoteRef:
        key: {{ $vaultKey }}
        property: mysqlUser
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: {{ $vaultKey }}
        property: mysqlPassword
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ $vaultKey }}
        property: jwtSecret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mood-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.vault.secretStoreName }}
    kind: SecretStore
  target:
    name: mood-secret
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ $vaultKey }}
        property: redisPassword
    - secretKey: MYSQL_USER
      remoteRef:
        key: {{ $vaultKey }}
        property: mysqlUser
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: {{ $vaultKey }}
        property: mysqlPassword
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ $vaultKey }}
        property: jwtSecret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.vault.secretStoreName }}
    kind: SecretStore
  target:
    name: redis-secret
  data:
    - secretKey: redis-password
      remoteRef:
        key: {{ $vaultKey }}
        property: redisPassword
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.vault.secretStoreName }}
    kind: SecretStore
  target:
    name: mysql-secret
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: {{ $vaultKey }}
        property: mysqlRootPassword
    - secretKey: MYSQL_USER
      remoteRef:
        key: {{ $vaultKey }}
        property: mysqlUser
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: {{ $vaultKey }}
        property: mysqlPassword
{{- end }}
