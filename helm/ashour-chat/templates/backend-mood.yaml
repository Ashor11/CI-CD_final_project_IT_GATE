apiVersion: v1
kind: ConfigMap
metadata:
  name: mood-config
  namespace: {{ .Release.Namespace }}
data:
  REDIS_HOST: {{ .Values.mood.config.REDIS_HOST | quote }}
  REDIS_PORT: {{ .Values.mood.config.REDIS_PORT | quote }}
  MYSQL_HOST: {{ .Values.mood.config.MYSQL_HOST | quote }}
  MYSQL_DATABASE: {{ .Values.mood.config.MYSQL_DATABASE | quote }}
  REACTIONS_SVC_URL: {{ .Values.mood.config.REACTIONS_SVC_URL | quote }}
---
{{- if not .Values.vault.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mood-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  MYSQL_USER: {{ .Values.secrets.mysqlUser | quote }}
  MYSQL_PASSWORD: {{ .Values.secrets.mysqlPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mood
  namespace: {{ .Release.Namespace }}
  labels:
    app: mood
spec:
  replicas: {{ .Values.mood.replicaCount }}
  selector:
    matchLabels:
      app: mood
  template:
    metadata:
      labels:
        app: mood
    spec:
      containers:
        - name: mood
          image: {{ .Values.moodImage | quote }}
          ports:
            - containerPort: {{ .Values.mood.service.port }}
          env:
            - name: PORT
              value: {{ .Values.mood.service.port | quote }}
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: mood-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: mood-config
                  key: REDIS_PORT
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: mood-config
                  key: MYSQL_HOST
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mood-config
                  key: MYSQL_DATABASE
            - name: REACTIONS_SVC_URL
              valueFrom:
                configMapKeyRef:
                  name: mood-config
                  key: REACTIONS_SVC_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mood-secret
                  key: REDIS_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mood-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mood-secret
                  key: MYSQL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mood-secret
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.mood.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mood-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: mood
  ports:
    - port: {{ .Values.mood.service.port }}
      targetPort: {{ .Values.mood.service.port }}
      name: http
