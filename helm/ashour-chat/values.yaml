# Ashour Chat - simple defaults. Override with -f custom.yaml or --set key=value.
# Install: helm install ashour-chat . -n ashour-chat --create-namespace

# App images (full name:tag). Override from CI: --set frontendImage=user/ashour-chat-frontend:2 etc.
frontendImage: "frontend:latest"
reactionsImage: "reactions:latest"
moodImage: "mood:latest"

# Ingress (one host, one Ingress resource)
ingress:
  enabled: true
  className: nginx
  host: buzzboard.local
  tls:
    enabled: true
    secretName: ingress-tls   # Create with: kubectl create secret tls ingress-tls --cert=tls.crt --key=tls.key -n <release-namespace>

# Optional: enable NetworkPolicies (can block traffic if labels differ)
networkPolicies:
  enabled: false

# --- Frontend ---
frontend:
  replicaCount: 1
  service:
    port: 80
  config:
    REACTIONS_SVC_URL: "http://reactions-svc:8080"
    MOOD_SVC_URL: "http://mood-svc:8080"

# --- Backend: reactions ---
reactions:
  replicaCount: 1
  service:
    port: 8080
  config:
    REDIS_HOST: "redis-svc"
    REDIS_PORT: "6379"
    MYSQL_HOST: "mysql-svc"
    MYSQL_DATABASE: "buzzboard"
    MOOD_SVC_URL: "http://mood-svc:8080"
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 70
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# --- Backend: mood ---
mood:
  replicaCount: 1
  service:
    port: 8080
  config:
    REDIS_HOST: "redis-svc"
    REDIS_PORT: "6379"
    MYSQL_HOST: "mysql-svc"
    MYSQL_DATABASE: "buzzboard"
    REACTIONS_SVC_URL: "http://reactions-svc:8080"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# --- Data: Redis ---
redis:
  replicaCount: 1
  image: "redis:7-alpine"
  config:
    maxmemory: "64mb"
    maxmemory-policy: "allkeys-lru"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# --- Data: MySQL ---
mysql:
  replicaCount: 1
  image: "mysql:8.0"
  database: buzzboard
  size: 2Gi
  # storageClassName: "" uses cluster default (works on minikube, k3d, kind)
  storageClassName: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Optional: create a StorageClass (e.g. for local clusters). Usually leave false.
storageClass:
  enabled: false
  name: standard-retain
  provisioner: rancher.io/local-path
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer

# Vault + External Secrets: when enabled, Secrets are synced from Vault instead of values.
# Requires Vault and External Secrets Operator installed; run bootstrap and create SecretStore (or use chart-created one).
vault:
  enabled: false
  # KV v2 path under mount "secret"; key name for ExternalSecret remoteRef (e.g. ashour-chat).
  path: "secret/ashour-chat"
  kvKey: "ashour-chat"
  address: "http://vault.vault.svc:8200"
  auth:
    role: "ashour-chat-eso"
    # Service account in release namespace used by ESO to authenticate to Vault (must match Vault role binding).
    serviceAccount: "default"
  secretStoreName: "vault-ashour-chat"

# Secrets (override in production; ignored when vault.enabled is true)
secrets:
  redisPassword: "buzzboard-redis-secret"
  mysqlRootPassword: "buzzboard-mysql-root"
  mysqlUser: "buzzboard"
  mysqlPassword: "buzzboard-mysql-secret"
  jwtSecret: "buzzboard-jwt-secret-change-in-production"
